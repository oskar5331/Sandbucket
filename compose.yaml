# Sandbucket stack: self-host (`docker compose up`) and the dev container
# (.devcontainer/ reuses this file and adds its own workspace service).
# Values come from .env; copy .env.example and replace every dev-only value
# before exposing this anywhere (docs/setup-config.md §5).

services:
  postgres:
    # Anchored so db-init runs the same image (and the same psql) as the server.
    image: &postgres-image postgres:17.11-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sandbucket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sandbucket"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published: only the app (and the dev container) reach it, over the
    # Compose network.

  db-init:
    image: *postgres-image
    command: ["bash", "/init/db-init.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?set DATABASE_OWNER_URL in .env}
    volumes:
      - ./compose/db-init.sh:/init/db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./compose/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      # S3 API, published because the browser uploads and downloads directly
      # through presigned URLs (docs/prd.md §20). RPC and admin stay internal.
      - "3900:3900"

  storage-init:
    image: node:26.13.0-bookworm-slim
    command: ["node", "/init/garage-init.mjs"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      BUCKET_NAME: ${BUCKET_NAME:?set BUCKET_NAME in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
    volumes:
      - ./compose/garage-init.mjs:/init/garage-init.mjs:ro
    depends_on:
      - garage
    restart: "no"

  app:
    build: .
    # .env is the app's only config source. No `environment:` here: Compose lets
    # it override env_file, so a self-hoster's .env value would be silently ignored
    # (a test in tests/infra/version-consistency.test.ts keeps it that way).
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  garage-meta:
  garage-data:
